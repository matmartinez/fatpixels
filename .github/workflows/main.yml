name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # No npm build. `docs/` is the page and the library it demonstrates lives at the repo
  # root; the site is the two staged together into _site/. (The demo used to load the
  # library from rawgithub.com, long dead, and this repo is private so no external host
  # can serve it — shipping it alongside is what makes the demo work.) That _site/ feeds
  # both targets.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage site
        run: |
          cp -R docs _site
          cp fatpixels.min.js _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site # unchanged from the Pages-only workflow

      - name: Upload site for Workers
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true

  # Target 1: GitHub Pages — the rollback, unchanged.
  pages:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write # to deploy to Pages
      id-token: write # to prove the deployment came from this workflow

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Target 2: Cloudflare Workers (staging).
  workers:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # for wrangler.jsonc

      # Restore the staged site INTO site/fatpixels/ — Workers matches the full request
      # path against the assets dir (./site) with no prefix stripping. See wrangler.jsonc.
      - name: Restore site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/fatpixels

      - name: Deploy to Cloudflare Workers (staging)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.152.0"
          command: deploy --env staging
